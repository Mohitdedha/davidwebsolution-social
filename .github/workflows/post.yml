name: David Web Solution — Social Auto-Poster

on:
  schedule:
    - cron: "0 6 * * *"   # 11:30 AM IST
    - cron: "0 9 * * *"   # 2:30 PM IST
    - cron: "0 13 * * *"  # 6:30 PM IST
    - cron: "0 17 * * *"  # 10:30 PM IST
  workflow_dispatch:
    inputs:
      pillar:
        description: "Force a content pillar (optional)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install groq requests -q

      - name: Run poster
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          DWS_FB_PAGE_ID:      ${{ secrets.DWS_FB_PAGE_ID }}
          DWS_FB_PAGE_TOKEN:   ${{ secrets.DWS_FB_PAGE_TOKEN }}
          DWS_IG_ACCOUNT_ID:   ${{ secrets.DWS_IG_ACCOUNT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY:       ${{ secrets.IMGBB_API_KEY }}
          POSTS_PER_RUN:       "1"
        run: python src/main.py
