name: David Web Solution — Social Auto-Poster

on:
  schedule:
    # TODAY ONLY (Oct 28): every hour, 2 posts per run
    # Revert to regular schedule tomorrow
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      pillar:
        description: "Force a content pillar (optional)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install groq requests Pillow -q

      - name: Run poster
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          DWS_FB_PAGE_ID:      ${{ secrets.DWS_FB_PAGE_ID }}
          DWS_FB_PAGE_TOKEN:   ${{ secrets.DWS_FB_PAGE_TOKEN }}
          DWS_IG_USER_TOKEN:   ${{ secrets.DWS_IG_USER_TOKEN }}
          DWS_IG_ACCOUNT_ID:   ${{ secrets.DWS_IG_ACCOUNT_ID }}
          PIXABAY_API_KEY:          ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:      ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY:            ${{ secrets.IMGBB_API_KEY }}
          DWS_LI_ACCESS_TOKEN:      ${{ secrets.DWS_LI_ACCESS_TOKEN }}
          DWS_LI_ORGANIZATION_ID:   ${{ secrets.DWS_LI_ORGANIZATION_ID }}
          POSTS_PER_RUN:            "2"
        run: python src/main.py
