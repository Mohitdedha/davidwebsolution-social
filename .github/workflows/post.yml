name: David Web Solution — Social Auto-Poster

on:
  schedule:
    - cron: "0 6 * * *"   # UK 6am / IST 11:30am  — UK morning wake-up
    - cron: "0 8 * * *"   # UK 8am / IST 1:30pm   — UK commute peak
    - cron: "0 10 * * *"  # UK 10am / IST 3:30pm  — UK mid-morning
    - cron: "0 12 * * *"  # UK 12pm / US-EST 7am  — UK lunch + US wakes up
    - cron: "0 14 * * *"  # UK 2pm  / US-EST 9am  — PEAK both audiences
    - cron: "0 17 * * *"  # UK 5pm  / US-EST 12pm — PEAK both audiences
    - cron: "0 19 * * *"  # UK 7pm  / US-EST 2pm  — US afternoon peak
    - cron: "0 21 * * *"  # UK 9pm  / US-EST 4pm  — US end-of-day peak
    - cron: "0 23 * * *"  # UK 11pm / US-EST 6pm  — US prime time
    - cron: "0 1 * * *"   # UK 1am  / US-EST 8pm  — US evening scrolling
  workflow_dispatch:
    inputs:
      pillar:
        description: "Force a content pillar (optional)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install groq requests Pillow -q

      - name: Run poster
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          DWS_FB_PAGE_ID:      ${{ secrets.DWS_FB_PAGE_ID }}
          DWS_FB_PAGE_TOKEN:   ${{ secrets.DWS_FB_PAGE_TOKEN }}
          DWS_IG_USER_TOKEN:   ${{ secrets.DWS_IG_USER_TOKEN }}
          DWS_IG_ACCOUNT_ID:   ${{ secrets.DWS_IG_ACCOUNT_ID }}
          PIXABAY_API_KEY:      ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY:       ${{ secrets.IMGBB_API_KEY }}
          POSTS_PER_RUN:       "1"
        run: python src/main.py
