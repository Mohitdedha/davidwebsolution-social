name: David Web Solution — Social Auto-Poster

on:
  schedule:
    # Every hour explicit triggers (GitHub can delay/skip a single entry)
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      pillar:
        description: "Force a content pillar (optional)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg -q
          pip install groq requests Pillow gtts -q

      - name: Set schedule config
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          HOUR=$(date -u +%-H)
          echo "Today UTC: $TODAY | Hour UTC: $HOUR"

          # Oct 28-29: every hour, 2 posts per run
          if [[ "$TODAY" == "2026-10-28" || "$TODAY" == "2026-10-29" ]]; then
            echo "POSTS_PER_RUN=2" >> $GITHUB_ENV
            echo "SHOULD_RUN=true" >> $GITHUB_ENV
            echo "[MODE] Boost days — 2 posts/hr"

          # Oct 30+: only at US/UK peak hours, 3 posts per run (10x3=30/day)
          else
            echo "POSTS_PER_RUN=3" >> $GITHUB_ENV
            # Peak hours UTC: 6,8,10,12,14,17,19,21,23,1
            if [[ "$HOUR" =~ ^(6|8|10|12|14|17|19|21|23|1)$ ]]; then
              echo "SHOULD_RUN=true" >> $GITHUB_ENV
              echo "[MODE] Regular — peak hour $HOUR UTC"
            else
              echo "SHOULD_RUN=false" >> $GITHUB_ENV
              echo "[SKIP] Hour $HOUR UTC is not a peak hour — skipping"
            fi
          fi

      - name: Run poster
        if: env.SHOULD_RUN == 'true'
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          DWS_FB_PAGE_ID:           ${{ secrets.DWS_FB_PAGE_ID }}
          DWS_FB_PAGE_TOKEN:        ${{ secrets.DWS_FB_PAGE_TOKEN }}
          DWS_IG_USER_TOKEN:        ${{ secrets.DWS_IG_USER_TOKEN }}
          DWS_IG_ACCOUNT_ID:        ${{ secrets.DWS_IG_ACCOUNT_ID }}
          PIXABAY_API_KEY:          ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:      ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY:            ${{ secrets.IMGBB_API_KEY }}
          DWS_LI_ACCESS_TOKEN:      ${{ secrets.DWS_LI_ACCESS_TOKEN }}
          DWS_LI_ORGANIZATION_ID:   ${{ secrets.DWS_LI_ORGANIZATION_ID }}
          POSTS_PER_RUN:            ${{ env.POSTS_PER_RUN }}
        run: python src/main.py
